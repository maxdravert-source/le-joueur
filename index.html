<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Joueur — L'Éveil</title>
  <meta name="description" content="Le Joueur — RPG/visual novel façon Solo Leveling, adapté du light novel de Maximilien Dravert. Prologue, AMV, donjons, Panthéon grec et jalons narratifs." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9C%9F%3C/text%3E%3C/svg%3E" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/framer-motion@10.18.0/dist/framer-motion.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com" crossorigin></script>
  <style>
    body { margin: 0; background: #04060f; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #a5b4fc; font-family: system-ui, sans-serif; gap: 14px; }
    #boot .ring { width: 42px; height: 42px; border: 3px solid #312e81; border-top-color: #818cf8; border-radius: 50%; animation: spin 1s linear infinite; }
    #boot h1 { margin: 0; font-size: 22px; letter-spacing: 0.3em; color: #67e8f9; }
    #boot p { margin: 0; font-size: 12px; color: #64748b; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <h1>LE JOUEUR</h1>
    <div class="ring"></div>
    <p>Initialisation du Système…</p>
  </div>
  <div id="root"></div>
  <script>
    /* Tailwind CDN + Babel standalone : le jeu démarre dès que game.tsx est compilé. */
    document.addEventListener("DOMContentLoaded", function () {
      fetch("game.tsx").then(function (r) { return r.text(); }).then(function (code) {
        var out = Babel.transform(code, {
          filename: "game.tsx",
          presets: ["react", "typescript"],
        }).code;
        var s = document.createElement("script");
        s.type = "module";
        s.textContent = out;
        document.body.appendChild(s);
        setTimeout(function () {
          var b = document.getElementById("boot");
          if (b && !document.querySelector("#root > *")) return; /* le jeu a pris le relais */
        }, 100);
      });
    });
    window.addEventListener("load", function () {
      /* Retire l'écran de démarrage dès que React a rendu quelque chose dans #root. */
      var iv = setInterval(function () {
        var root = document.getElementById("root");
        var boot = document.getElementById("boot");
        if (root && root.childElementCount > 0 && boot) { boot.remove(); clearInterval(iv); }
      }, 200);
    });
  </script>
</body>
</html>
